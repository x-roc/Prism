name: Build Prism Native AOT

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Linux-x64 Native AOT
        run: |
          dotnet publish -c Release -r linux-x64 /home/runner/work/${{ github.event.repository.name }}/${{ github.event.repository.name }}/Prism/Prism.csproj /p:PublishAot=true
      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-linux-x64
          path: Prism/bin/Release/net10.0/linux-x64/publish/Prism

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish Win-x64 Native AOT
        run: |
          dotnet publish -c Release -r win-x64 Prism/Prism.csproj /p:PublishAot=true
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-win-x64
          path: Prism\bin\Release\net10.0\win-x64\publish\Prism.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Publish MacOS-x64 Native AOT
        run: |
          dotnet publish -c Release -r osx-x64 Prism/Prism.csproj /p:PublishAot=true
      - name: Upload MacOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: prism-osx-x64
          path: Prism/bin/Release/net10.0/osx-x64/publish/Prism

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: prism-linux-x64
          path: ./artifacts/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: prism-win-x64
          path: ./artifacts/win-x64
      - uses: actions/download-artifact@v4
        with:
          name: prism-osx-x64
          path: ./artifacts/osx-x64
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ./artifacts/linux-x64/Prism
            ./artifacts/win-x64/Prism.exe
            ./artifacts/osx-x64/Prism
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
