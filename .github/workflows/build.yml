name: Release Native AOT Builds

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            rid: win-x64
            ext: .exe
          - name: linux-x64
            os: ubuntu-latest
            rid: linux-x64
            ext: ""
          - name: macos-x64
            os: macos-13
            rid: osx-x64
            ext: ""
          - name: macos-arm64
            os: macos-14
            rid: osx-arm64
            ext: ""
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Prism.csproj

      - name: Publish Native AOT single-file
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Prism.csproj \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:PublishAot=true \
            -p:PublishSingleFile=true \
            -p:PublishTrimmed=true \
            -p:SelfContained=true \
            -p:IlcOptimizationPreference=Size \
            -p:InvariantGlobalization=true \
            -p:EnableCompressionInSingleFile=true \
            -p:StripSymbols=true \
            -p:DebuggerSupport=false \
            -p:StackTraceSupport=false \
            -p:EventSourceSupport=false \
            -o "artifacts/${{ matrix.name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prism-${{ matrix.name }}
          path: artifacts/${{ matrix.name }}/Prism*

      - name: Upload release asset
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/${{ matrix.name }}/Prism*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}